<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오와 로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f1; --card:#ffffff; --ink:#1d2320; --muted:#68706b; --line:#dbdfdb;
  --claret:#8a2341; --claret-soft:#f3e3e8;
  --good:#2e7a57; --mid:#a87a1f; --bad:#a3443a;
  --display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141816; --card:#1d2220; --ink:#e7ebe8; --muted:#9aa29d; --line:#2f3633;
    --claret:#d8708e; --claret-soft:#3a2229; --good:#5fbf8f; --mid:#d6aa4f; --bad:#e07f73; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; padding-bottom:84px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 16px}
header.top{display:grid; gap:10px; padding:18px 16px 12px; max-width:640px; margin:0 auto}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.brand h1{font-size:24px; letter-spacing:-.01em}
.brand h1 span{color:var(--claret)}
.who{color:var(--muted); font-size:13px; background:none; border:0; padding:0; cursor:pointer; text-decoration:underline dotted}
.meet-row{display:flex; gap:8px; align-items:center}
.meet-row select{flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card)}
.notice{background:var(--claret-soft); border-radius:10px; padding:10px 12px; font-size:14px}
.notice[hidden]{display:none}
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); z-index:5; padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{padding:12px 4px 14px; text-align:center; text-decoration:none; color:var(--muted); font-size:13px; font-weight:500}
nav.tabs a.on{color:var(--claret); box-shadow:inset 0 3px 0 var(--claret)}
section.view{display:none; gap:12px}
section.view.on{display:grid}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}
.wine-head{display:flex; gap:12px; align-items:flex-start}
.wine-head .grow{flex:1; min-width:0}
.wine-name{font-weight:700}
.meta{color:var(--muted); font-size:13px}
.pill{display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.pill.done{border-color:var(--good); color:var(--good)}
.style-스파클링{--sc:#7a8fa6}.style-화이트{--sc:#b39b45}.style-로제{--sc:#c46b7d}.style-레드{--sc:#8a2341}.style-스위트{--sc:#b2703a}.style-기타{--sc:#68706b}
.stripe{border-left:4px solid var(--sc, var(--line))}
.thumb{width:52px; height:68px; border-radius:8px; object-fit:cover; background:var(--bg); border:1px solid var(--line); flex:none; cursor:zoom-in; padding:0}
.thumb.ph{display:grid; place-items:center; color:var(--muted); font-size:11px; cursor:pointer; text-align:center; line-height:1.2}
.crit{display:grid; grid-template-columns:52px 1fr; align-items:center; gap:8px; margin-top:10px}
.crit label{font-size:13px; color:var(--muted)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{min-width:40px; padding:8px 0; border-radius:10px; border:1px solid var(--line); background:transparent; cursor:pointer; text-align:center}
.chip.wide{min-width:56px; padding:8px 10px}
.chip[aria-pressed="true"]{background:var(--claret); border-color:var(--claret); color:#fff}
.chip.rb-있음[aria-pressed="true"]{background:var(--good); border-color:var(--good)}
.chip.rb-△[aria-pressed="true"]{background:var(--mid); border-color:var(--mid)}
.chip.rb-없음[aria-pressed="true"]{background:var(--bad); border-color:var(--bad)}
.chip:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,nav.tabs a:focus-visible,.seg button:focus-visible{outline:2px solid var(--claret); outline-offset:2px}
textarea,input[type=text],input[type=number],input[type=date],input[type=search],input[type=password]{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
textarea{min-height:44px; resize:vertical}
.btn{padding:10px 14px; border-radius:10px; border:1px solid var(--claret); background:var(--claret); color:#fff; cursor:pointer; font-weight:500}
.btn.ghost{background:transparent; color:var(--claret)}
.btn.plain{background:transparent; color:var(--muted); border-color:var(--line)}
.btn.small{padding:6px 10px; font-size:13px}
.btn:disabled{opacity:.5; cursor:default}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.right{justify-content:flex-end}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.score{font-family:var(--display); font-size:22px; font-variant-numeric:tabular-nums}
.rank{display:grid; grid-template-columns:28px auto 1fr auto; gap:10px; align-items:center}
.rank .no{font-family:var(--display); font-size:18px; color:var(--muted); text-align:center}
.rank .thumb{width:40px; height:52px}
.bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px}
.bar > i{display:block; height:100%; background:var(--claret)}
.mini{display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; font-size:13px; margin-top:8px; font-variant-numeric:tabular-nums}
details summary{cursor:pointer; color:var(--claret); font-size:13px; margin-top:8px}
.empty{color:var(--muted); text-align:center; padding:24px 8px}
.sect-title{font-size:17px}
.kv{display:flex; justify-content:space-between; gap:8px; font-size:14px}
.kv b{font-variant-numeric:tabular-nums; text-align:right}
.styles{display:grid; gap:6px; margin-top:8px}
.styles .s{display:grid; grid-template-columns:62px 1fr 34px; gap:8px; align-items:center; font-size:13px; font-variant-numeric:tabular-nums}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center}
.stats b{display:block; font-family:var(--display); font-size:18px; font-variant-numeric:tabular-nums}
.stats span{font-size:12px; color:var(--muted)}
.seg{display:grid; grid-template-columns:repeat(4,1fr); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px}
.seg button{border:0; background:transparent; padding:8px 2px; border-radius:9px; font-size:13px; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--claret-soft); color:var(--claret); font-weight:700}
.year > summary{list-style:none; display:flex; justify-content:space-between; align-items:center; color:var(--ink); font-family:var(--display); font-size:17px; margin:4px 2px 8px; cursor:pointer}
.year > summary::-webkit-details-marker{display:none}
.year > summary::after{content:"▾"; color:var(--muted); font-size:14px}
.year:not([open]) > summary::after{content:"▸"}
.mcard{cursor:pointer; display:block; width:100%; text-align:left; margin-bottom:8px}
.mcard:hover{border-color:var(--claret)}
.lst{display:grid; gap:2px}
.lst .it{display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px}
.lst .it:last-child{border-bottom:0}
.lst .it .n{color:var(--muted); font-family:var(--display); text-align:center}
.lst .it b{font-variant-numeric:tabular-nums}
.filters{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.filters select{padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:13px}
/* dialogs / sheets */
.sheet{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:10}
.sheet.on{display:flex}
.sheet .panel{background:var(--card); width:100%; max-width:640px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:grid; gap:12px}
.sheet .panel.center{border-radius:16px; max-width:360px; margin:auto; align-self:center}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.x{border:0; background:transparent; font-size:22px; line-height:1; color:var(--muted); cursor:pointer; padding:4px 8px}
.viewer{position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:20; padding:16px}
.viewer.on{display:flex}
.viewer img{max-width:100%; max-height:100%; border-radius:8px}
.labelPick{display:flex; gap:10px; align-items:center}
.labelPick img{width:60px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
.fld{display:grid; gap:4px}
.fld > span{font-size:12px; color:var(--muted)}
.wname{all:unset; cursor:pointer; font-weight:700; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px}
.wname:hover{text-decoration-color:var(--claret)}
.wname:focus-visible{outline:2px solid var(--claret); outline-offset:2px; border-radius:4px}
.info-hero{display:flex; gap:12px; align-items:flex-start}
.info-hero img{width:84px; height:112px; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:zoom-in}
.facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.isec h4{font-family:var(--display); font-size:15px; margin:0 0 4px; color:var(--claret)}
.isec p{margin:0; white-space:pre-wrap}
.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:99px; font-size:13px; z-index:30; opacity:0; pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: no-preference){ .chip{transition:background .12s,border-color .12s} .toast{transition:opacity .2s} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>오와 <span>로그</span></h1><button class="who" id="who" type="button"></button></div>
  <div class="meet-row">
    <select id="meetSel" aria-label="모임 선택"></select>
  </div>
  <div class="notice" id="notice" hidden></div>
</header>

<main class="wrap">
  <!-- 평가 -->
  <section class="view" id="v-rate">
    <div id="rateList"></div>
    <button class="btn ghost" id="openAddWine" type="button">＋ 이 모임에 와인 추가</button>
  </section>

  <!-- 결과 -->
  <section class="view" id="v-results"><div id="resultsBox"></div></section>

  <!-- 회원 취향 -->
  <section class="view" id="v-members">
    <p class="meta" style="margin:0">모든 모임의 평가를 합쳐 계산해요. 점수는 향·맛·여운 평균(5점 만점)이에요.</p>
    <div id="membersBox"></div>
  </section>

  <!-- 모임 기록 -->
  <section class="view" id="v-history">
    <div class="card"><div class="stats" id="statsBox"></div></div>
    <div class="seg" role="group" aria-label="기록 보기" id="hSeg">
      <button data-h="list" aria-pressed="true">모임</button>
      <button data-h="top" aria-pressed="false">TOP 10</button>
      <button data-h="value" aria-pressed="false">가성비</button>
      <button data-h="search" aria-pressed="false">검색</button>
    </div>
    <div id="hBox"></div>
    <div class="row">
      <button class="btn" id="openAddMeet" type="button" style="flex:1">＋ 새 모임</button>
      <button class="btn ghost" id="exportBtn" type="button">CSV 내보내기</button>
    </div>
    <div id="archiveBox"></div>
  </section>
</main>

<nav class="tabs" aria-label="화면">
  <a href="#rate" data-v="rate">평가</a>
  <a href="#results" data-v="results">결과</a>
  <a href="#members" data-v="members">회원 취향</a>
  <a href="#history" data-v="history">모임 기록</a>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="sheetPanel"></div></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt="라벨 사진"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 설정: Supabase 연결 정보 (비어 있으면 미리보기 모드) ===== */
const CONFIG = { url:"https://lycqkionkchxwgyfeoei.supabase.co", key:"sb_publishable_kpquA-XuU2v5CP6xRSAL4g_pvIsw88h" };

const STYLES=["스파클링","화이트","로제","레드","스위트","기타"];
const CRIT=[["a","향"],["t","맛"],["f","여운"]];
const RB=["있음","△","없음"];
const S={meetings:[],wines:[],ratings:[],me:"",meetId:null,hView:"list",q:"",fStyle:"",fYear:"",fMember:""};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null||isNaN(n)?"–":n.toFixed(2);
const won=n=>n?Number(n).toLocaleString("ko-KR")+"원":"";
const manwon=n=>n?(n>=10000?Math.round(n/1000)/10+"만":Number(n).toLocaleString("ko-KR"))+"원":"–";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function notice(msg){const n=$("notice"); n.hidden=!msg; n.textContent=msg||"";}
let toastT; function toast(m){const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800);}

/* ===== 와인 설명 (처음 들어 있는 5병) ===== */
const INFO_FIELDS=[["grape","품종"],["region","지역"],["regionNote","지역 설명"],["producer","생산자"],["producerNote","생산자 특징"],["cuveeNote","퀴베 특징"],["serve","서빙 팁"]];
const GEANTET="1954년 에드몽 장테와 베르나데트 팡시오가 결혼하면서 시작한 쥬브레 샹베흐땅의 가족 도멘이에요. 지금은 뱅상 장테와 아들 파비앙이 함께 운영하고, 쥬브레·샹볼 뮈지니·막사네 등에 밭이 있어요. 레드가 주력이고, 과일감이 풍부하면서 타닌이 섬세한 스타일로 평가받아요.\n라벨에 적힌 모토가 \"절제한다는 건 좋은 걸 마시는 것(Être sobre, c'est boire bon)\"이에요.";
const SEED_INFO={
  w1:{grape:"샤흐도네, 피노 누아 (빈티지마다 다름 · 예: 샤흐도네 56%, 피노 누아 44%)",region:"프랑스 샹파뉴",
    regionNote:"파리 북동쪽의 서늘한 산지예요. 백악질 토양과 서늘한 기후 덕분에 산도가 높고 섬세한 베이스 와인이 나오고, 병 안에서 2차 발효를 시켜 기포를 만들어요.\n'밀레짐'은 작황이 좋은 한 해의 포도만으로 만든 빈티지 샴페인이라는 뜻이에요. 논빈티지보다 숙성 기간 기준이 길어요(최소 3년).",
    producer:"샤흘 드 까자노브 (Charles de Cazanove)",
    producerNote:"1811년 유리 공예 가문 출신 샤흘 가브리엘 드 까자노브가 코트 데 블랑의 아비즈에서 세웠고, 지금은 랭스에 본사가 있어요. 샹파뉴에서 손꼽히게 오래된 하우스이고, 현재는 라프노 가문이 소유하고 있어요.",
    cuveeNote:"샤흐도네와 피노 누아를 비슷한 비율로 섞은 빈티지 브뤼예요. 샤흐도네의 시트러스·흰꽃 향에 피노 누아의 바디감이 더해지고, 긴 숙성에서 오는 브리오슈·견과 뉘앙스를 기대할 수 있어요.\n빈티지 표기가 비어 있으니 병에서 확인해 채워주세요.",
    serve:"8–10°C · 식전주, 해산물, 튀김"},
  w2:{grape:"소비뇽 블랑 100%",region:"프랑스 루아흐 · 상세흐",
    regionNote:"루아흐강 상류의 언덕 마을로, 소비뇽 블랑의 기준이 되는 산지예요. 토양은 크게 실렉스(부싯돌), 카이요트(단단한 석회 조각), 떼흐 블랑슈(이회토) 세 가지예요. 실렉스는 스모키하고 날 선 미네랄을, 석회는 향긋하고 둥근 느낌을 준다고 해요.",
    producer:"도멘 바슈홍 (Domaine Vacheron)",
    producerNote:"1900년 무렵 시작한 가족 도멘으로, 사촌 사이인 장 로랑과 장 도미니크 바슈홍이 이끌어요. 2005년 바이오다이내믹 인증(Biodyvin)을 받았고, 손 수확과 토착 효모 발효를 고집해요. 상세흐 최상위 생산자로 꼽혀요.",
    cuveeNote:"도멘의 기본 상세흐 블랑이에요. 수령 30–50년 된 나무에서 딴 실렉스 밭과 석회 밭 포도를 반씩 섞고, 탱크에서 4개월 정도 숙성해요. 자몽·레몬, 풀 향에 부싯돌 같은 미네랄이 특징이에요.",
    serve:"8–10°C · 염소치즈, 굴, 흰살생선"},
  w3:{grape:"샤흐도네 100%",region:"프랑스 부흐고뉴 (지방 단위 AOC)",
    regionNote:"부흐고뉴 블랑은 부흐고뉴 전역의 샤흐도네로 만들 수 있는 가장 넓은 등급이에요. 마을·1등급·특등급보다 아래 단계지만, 좋은 도멘 것은 그 도멘 스타일을 부담 없이 맛보는 입문용으로 가치가 커요.",
    producer:"도멘 장테 팡시오 (Domaine Geantet-Pansiot)",producerNote:GEANTET,
    cuveeNote:"레드로 유명한 도멘이 만드는 화이트예요. 사과·레몬, 흰꽃 계열 향과 산뜻한 산도를 기대할 수 있어요. 같은 날 마시는 바슈홍 상세흐와 소비뇽 블랑 vs 샤흐도네로 비교해 보기 좋아요.",

/* ===== 저장소: Supabase (깃허브 배포용) ===== */
const SupaStore={
  sb:null, cbs:[], d:{meetings:[],wines:[],ratings:[]},
  async init(teamKey){
    await new Promise((res,rej)=>{const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; s.onload=res; s.onerror=rej; document.head.appendChild(s);});
    this.sb=supabase.createClient(CONFIG.url,CONFIG.key,{global:{headers:{"x-owa-key":teamKey}},auth:{persistSession:false}});
    const ok=await this.sb.rpc("owa_ok"); if(ok.error) throw ok.error; if(ok.data!==true) throw new Error("bad key");
    await this.reload();
    setInterval(()=>{ if(document.visibilityState==="visible") this.reload().catch(()=>{}); },20000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") this.reload().catch(()=>{}); });
  },
  t:null, reloadSoon(){ clearTimeout(this.t); this.t=setTimeout(()=>this.reload(),400); },
  async reload(){
    const [m,w,r]=await Promise.all([this.sb.from("meetings").select("*"),this.sb.from("wines").select("*"),this.sb.from("ratings").select("*")]);
    if(m.error) throw m.error;
    const cm=x=>({id:x.id,title:x.title,date:x.date||"",place:x.place||"",attendees:x.attendees||"",memo:x.memo||"",archived:x.archived,createdAt:x.created_at});
    const cw=x=>({id:x.id,meetingId:x.meeting_id,order:x.sort,name:x.name,vintage:x.vintage||"",style:x.style,price:x.price||0,label:x.label_url||"",info:x.info||{},archived:x.archived,createdAt:x.created_at});
    const cr=x=>({wineId:x.wine_id,member:x.member,a:x.a,t:x.t,f:x.f,rebuy:x.rebuy||"",note:x.note||"",updatedAt:x.updated_at});
    this.d={meetings:m.data.map(cm),wines:(w.data||[]).map(cw),ratings:(r.data||[]).map(cr)};
    this.cbs.forEach(cb=>cb(this.d));
  },
  onChange(cb){ this.cbs.push(cb); },
  async run(q){ const {error}=await q; if(error) throw error; this.reloadSoon(); },
  saveMeeting(m){ return this.run(this.sb.from("meetings").upsert({id:m.id,title:m.title,date:m.date||null,place:m.place,attendees:m.attendees,memo:m.memo,archived:!!m.archived})); },
  saveWine(w){ return this.run(this.sb.from("wines").upsert({id:w.id,meeting_id:w.meetingId,sort:w.order,name:w.name,vintage:w.vintage,style:w.style,price:w.price||0,label_url:w.label||null,info:w.info||{},archived:!!w.archived})); },
  saveRating(r){ return this.run(this.sb.from("ratings").upsert({wine_id:r.wineId,member:r.member,a:r.a??null,t:r.t??null,f:r.f??null,rebuy:r.rebuy||null,note:r.note||null,updated_at:new Date().toISOString()})); },
  async uploadLabel(blob){ const path=uid()+".jpg"; const {error}=await this.sb.storage.from("labels").upload(path,blob,{contentType:"image/jpeg"}); if(error) throw error; return this.sb.storage.from("labels").getPublicUrl(path).data.publicUrl; }
};

const live=()=>({meetings:S.meetings.filter(m=>!m.archived), wines:S.wines.filter(w=>!w.archived)});
function total(r){ if(!r) return null; const v=CRIT.map(([k])=>r[k]).filter(x=>typeof x==="number"); return v.length===3?v.reduce((a,b)=>a+b,0)/3:null; }
function myRating(wid){ return S.ratings.find(r=>r.wineId===wid&&r.member===S.me)||{}; }
function wineStats(w){
  const rs=S.ratings.filter(r=>r.wineId===w.id); const done=rs.map(r=>({r,t:total(r)})).filter(x=>x.t!=null); const n=done.length;
  const by=k=>n?done.reduce((a,x)=>a+x.r[k],0)/n:null;
  const rb=rs.filter(r=>r.rebuy); const yes=rb.filter(r=>r.rebuy==="있음").length;
  return {w,n,avg:n?done.reduce((a,x)=>a+x.t,0)/n:null,a:by("a"),t:by("t"),f:by("f"),rbN:rb.length,yes,rs};
}
function meetWines(mid){ return live().wines.filter(w=>w.meetingId===mid).sort((a,b)=>(a.order||0)-(b.order||0)); }

$("rateList").addEventListener("click",e=>{

/* 사진 줄이기 */
async function shrink(file,max=900){
  const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);});
  const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  return await new Promise(res=>c.toBlob(res,"image/jpeg",0.82));
}

  const m=meetById(id); if(!m) return; const ws=meetWines(id); const st=ws.map(wineStats).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  const spend=ws.reduce((a,w)=>a+(+w.price||0),0); const raters=new Set(); st.forEach(s=>s.rs.forEach(r=>raters.add(r.member)));
  openSheet(`<div class="sheet-head"><h3 class="sect-title">${esc(m.title)}</h3><button class="x" data-close aria-label="닫기">×</button></div>
    <div>${m.date?`<div class="kv"><span>날짜</span><b>${esc(m.date)}</b></div>`:""}${m.place?`<div class="kv"><span>장소</span><b>${esc(m.place)}</b></div>`:""}
    ${m.attendees?`<div class="kv"><span>참석자</span><b>${esc(m.attendees)}</b></div>`:""}<div class="kv"><span>와인</span><b>${ws.length}병${spend?" · "+won(spend):""}</b></div><div class="kv"><span>평가한 회원</span><b>${raters.size}명</b></div></div>
    ${m.memo?`<div class="notice">${esc(m.memo)}</div>`:""}
    <div class="lst">${st.map((s,i)=>`<div class="it" style="grid-template-columns:24px auto 1fr auto"><span class="n">${s.avg!=null?i+1:"–"}</span>${thumb(s.w,"")}<span>${wname(s.w)}<br><span class="meta">${esc(s.w.style)}${s.w.price?" · "+won(s.w.price):""}${s.rbN?` · 재구매 ${Math.round(s.yes/s.rbN*100)}%`:""}</span></span><b>${fmt(s.avg)}</b></div>`).join("")||'<div class="empty">와인이 없어요.</div>'}</div>
    <div class="row right"><button class="btn plain" id="mdEdit">정보 수정</button><button class="btn" id="mdPick">${m.id===S.meetId?"평가하러 가기":"이 모임 선택"}</button></div>`);
  $("mdEdit").onclick=()=>openMeetEdit(m);
  $("mdPick").onclick=()=>{ S.meetId=m.id; lsSet("owa-meet",m.id); closeSheet(); location.hash="#rate"; renderAll(); };
}

/* CSV 내보내기 */
function buildCSV(){
  const members=[...new Set(S.ratings.map(r=>r.member))].sort();
  const head=["모임","날짜","장소","순서","와인","빈티지","종류","가격","평균","향","맛","여운","평가 수","재구매 있음 %",...members];
  const q=v=>{const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=live().wines.filter(w=>meetById(w.meetingId)&&!meetById(w.meetingId).archived).map(w=>{const m=meetById(w.meetingId); const s=wineStats(w);
    return [m.title,m.date,m.place,w.order,w.name,w.vintage,w.style,w.price||"",s.avg?.toFixed(2)??"",s.a?.toFixed(2)??"",s.t?.toFixed(2)??"",s.f?.toFixed(2)??"",s.n,s.rbN?Math.round(s.yes/s.rbN*100):"",
      ...members.map(u=>{const r=s.rs.find(x=>x.member===u); const t=total(r); return t!=null?t.toFixed(2):"";})];})
    .sort((a,b)=>String(b[1]).localeCompare(String(a[1]))||a[3]-b[3]);
  return [head,...rows].map(r=>r.map(q).join(",")).join("\n");
}
$("exportBtn").addEventListener("click",()=>{
  const csv=buildCSV(); const name=`오와로그_${new Date().toISOString().slice(0,10)}.csv`;
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  openSheet(`<div class="sheet-head"><h3 class="sect-title">CSV 내보내기</h3><button class="x" data-close aria-label="닫기">×</button></div>
    <p class="meta" style="margin:0">다운로드가 안 되면 아래 내용을 복사해서 엑셀이나 구글 시트에 붙여넣으세요.</p>
    <textarea readonly style="min-height:160px; font-size:12px">${esc(csv)}</textarea>
    <div class="row right"><button class="btn" id="cpBtn">복사</button></div>`);
  $("cpBtn").onclick=async()=>{ try{ await navigator.clipboard.writeText(csv); toast("복사했어요"); }catch(e){ toast("길게 눌러 직접 복사해주세요"); } };
});

/* 이름 */
function askName(){
  openSheet(`<h3 class="sect-title">반가워요!</h3><p class="meta" style="margin:0">평가에 표시될 이름을 정해주세요. 모임 안에서 겹치지 않게 써주세요.</p>
    <input type="text" id="nmIn" value="${esc(S.me)}" placeholder="예: 재홍" maxlength="20">
    <div class="row right"><button class="btn" id="nmSave">시작하기</button></div>`,{center:true});
  const go=()=>{ const v=$("nmIn").value.trim(); if(!v){ $("nmIn").focus(); return; } S.me=v; lsSet("owa-me",v); closeSheet(); renderAll(); };
  $("nmSave").onclick=go; $("nmIn").onkeydown=e=>{ if(e.key==="Enter") go(); };
}
$("who").addEventListener("click",askName);

/* 모임 선택 */
function renderMeetSel(){
  const ms=[...live().meetings].sort((a,b)=>String(b.date||b.createdAt).localeCompare(String(a.date||a.createdAt)));
  $("meetSel").innerHTML=ms.length?ms.map(m=>`<option value="${esc(m.id)}" ${m.id===S.meetId?"selected":""}>${esc(m.title)}${m.date?" · "+esc(m.date):""}</option>`).join(""):'<option>모임 없음</option>';
}
$("meetSel").addEventListener("change",e=>{ S.meetId=e.target.value; lsSet("owa-meet",S.meetId); renderAll(); });

function renderAll(){
  $("who").textContent=S.me?S.me+" 님":"이름 정하기";
  renderMeetSel(); renderRate(); renderResults(); renderMembers(); renderHistory();
}

/* ===== 시작 ===== */
function onData(d){
  S.meetings=d.meetings; S.wines=d.wines; S.ratings=d.ratings;
  const ms=live().meetings;
  if(!S.meetId||!ms.find(m=>m.id===S.meetId)){ const saved=lsGet("owa-meet"); const sorted=[...ms].sort((a,b)=>String(b.date||b.createdAt).localeCompare(String(a.date||a.createdAt))); S.meetId=(ms.find(m=>m.id===saved)||sorted[0]||{}).id||null; }
  renderAll();
}
(async()=>{
  S.me=lsGet("owa-me")||"";
  renderAll();
  Store.onChange(onData);
  if(DEMO){
    await Store.init();
    notice("미리보기 모드예요. 예시 데이터가 들어 있고, 입력한 내용은 이 기기에만 저장돼요.");
    if(!S.me) askName();
    return;
  }
  const hashKey=async raw=>{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); };
  const start=async key=>{
    try{ await Store.init(key); lsSet("owa-key",key); notice(""); if(!S.me) askName(); }
    catch(e){ lsSet("owa-key",""); askKey("암호가 맞지 않거나 연결에 실패했어요."); }
  };
  const askKey=(err)=>{
    openSheet(`<h3 class="sect-title">오와 로그</h3><p class="meta" style="margin:0">모임 암호를 입력해주세요. 한 번 입력하면 이 기기에서는 다시 묻지 않아요.</p>
      ${err?`<div class="notice">${esc(err)}</div>`:""}<input type="password" id="keyIn" placeholder="모임 암호" autocomplete="current-password">
      <div class="row right"><button class="btn" id="keyGo">들어가기</button></div>`,{center:true,onClose:()=>{ if(!lsGet("owa-key")){ notice("모임 암호를 입력해야 볼 수 있어요. 여기를 눌러 입력하세요."); $("notice").onclick=()=>{ $("notice").onclick=null; askKey(); }; } }});
    const go=async()=>{ const v=$("keyIn").value.trim(); if(!v) return; closeSheet(); start(await hashKey(v)); };
    $("keyGo").onclick=go; $("keyIn").onkeydown=e=>{ if(e.key==="Enter") go(); };
  };
  const k=lsGet("owa-key"); if(k) start(k); else askKey();
})();
</script>
